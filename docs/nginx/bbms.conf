# BBMS Production Nginx Reverse Proxy Configuration
# Architecture Reference: SAD 3.6 & 3.9 (Infrastructure, TLS, Security)
# Requirements: NFR-SEC-03 (TLS 1.2+ encrypted transport), NFR-PERF-02

# Redirect all HTTP traffic to HTTPS (NFR-SEC-03)
server {
    listen 80;
    listen [::]:80;
    server_name bbms.local bloodbank.org;

    return 301 https://$host$request_uri;
}

# HTTPS Server Block (TLS 1.2 and TLS 1.3 only)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bbms.local bloodbank.org;

    # SSL Certificates
    ssl_certificate /etc/ssl/certs/bbms.crt;
    ssl_certificate_key /etc/ssl/private/bbms.key;

    # NFR-SEC-03: Protocols & Ciphers (Reject SSLv3, TLS 1.0, TLS 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (HSTS, clickjacking, MIME sniffing, XSS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression (NFR-PERF-02: fast page load under 3s)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Frontend SPA
    root /var/www/bbms/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        # Timeouts to enforce SLA (NFR-PERF-01, NFR-PERF-03)
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
